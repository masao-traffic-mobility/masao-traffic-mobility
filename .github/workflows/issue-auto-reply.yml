name: Issue Auto Reply

on:
  issues:
    types: [opened]

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post auto-reply comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "ご連絡ありがとうございます。内容を確認の上、数日以内に返信いたします。\n\n---\n\nThank you for reaching out. I'll review this and get back to you within a few days."
            })
